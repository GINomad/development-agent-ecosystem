<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
  <title id="title">Development Agent Ecosystem repository architecture</title>
  <desc id="desc">Repository source of truth, prompts, skills, Orchestrator routing, explicit pipeline ownership and definition allowlists, capacity-limited task leases, FIFO queueing, and task-specific full Git clones, event-driven chain scripts, seven agents, guarded Azure delivery, and revisioned task state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071019"/><stop offset="0.55" stop-color="#0b1420"/><stop offset="1" stop-color="#12192a"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3c35"/><stop offset="1" stop-color="#112a28"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#192b41"/><stop offset="1" stop-color="#111e2e"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#253451"/><stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <linearGradient id="external" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#342747"/><stop offset="1" stop-color="#211b34"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#00050d" flood-opacity="0.45"/></filter>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5ee0b1"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#83a7ff"/></marker>
    <marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b59cff"/></marker>
    <style>
      .title{font:700 48px 'Segoe UI',Arial,sans-serif;fill:#f5f8fc;letter-spacing:-1.4px}.subtitle{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#98abc1}
      .lane{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#66e3b5;letter-spacing:2.7px}.box-title{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#f2f7fc}
      .copy{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#adbdcf}.small{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#879bb1}.mono{font:600 14px Consolas,'Segoe UI',monospace;fill:#d5e2ef}
      .agent-title{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#f3f7fc}.agent-copy{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#aebed1}
      .edge{fill:none;stroke:#5ee0b1;stroke-width:2.7;marker-end:url(#green)}.edge-bi{fill:none;stroke:#5ee0b1;stroke-width:2.7;marker-start:url(#green);marker-end:url(#green)}
      .edge-blue{fill:none;stroke:#83a7ff;stroke-width:2.4;marker-end:url(#blue)}.edge-violet{fill:none;stroke:#b59cff;stroke-width:2.4;marker-end:url(#violet)}
      .edge-dashed{fill:none;stroke:#83a7ff;stroke-width:2.2;stroke-dasharray:9 8;marker-end:url(#blue)}.label{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#a9b9ca}
      .extend{fill:#102b25;stroke:#63e0b3;stroke-width:1.5;stroke-dasharray:6 4}.extend-text{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#7aebc3;letter-spacing:.4px}
    </style>
  </defs>
  <rect width="1800" height="1220" fill="url(#bg)"/>
  <circle cx="130" cy="80" r="300" fill="#38d7a1" opacity="0.05"/><circle cx="1670" cy="100" r="360" fill="#7d92ff" opacity="0.06"/>
  <text x="75" y="82" class="lane">REPOSITORY COMPOSITION AND RUNTIME FLOW</text>
  <text x="75" y="140" class="title">Development Agent Ecosystem</text>
  <text x="75" y="180" class="subtitle">How configuration, prompts, skills, runtime scripts, agents, knowledge, and Azure DevOps fit together.</text>
  <rect x="1450" y="112" width="275" height="58" rx="16" class="extend"/>
  <text x="1475" y="147" class="extend-text" style="font-size:14px">+  EXTENSION POINT</text>

  <!-- lane backgrounds -->
  <rect x="55" y="225" width="430" height="920" rx="28" fill="#0c1722" stroke="#243343"/>
  <rect x="515" y="225" width="480" height="920" rx="28" fill="#0d1724" stroke="#26374b"/>
  <rect x="1025" y="225" width="430" height="920" rx="28" fill="#0e1727" stroke="#2a3850"/>
  <rect x="1485" y="225" width="260" height="920" rx="28" fill="#121526" stroke="#393550"/>
  <text x="85" y="265" class="lane">01 · REPOSITORY SOURCES</text>
  <text x="545" y="265" class="lane">02 · RUNTIME AND COMPILATION</text>
  <text x="1055" y="265" class="lane">03 · CUSTOM AGENTS</text>
  <text x="1515" y="265" class="lane">04 · EXTERNAL STATE</text>

  <!-- repository sources -->
  <g filter="url(#shadow)">
    <rect x="85" y="300" width="370" height="125" rx="19" fill="url(#source)" stroke="#32705d"/>
    <rect x="320" y="314" width="115" height="27" rx="9" class="extend"/><text x="337" y="332" class="extend-text">+ REPOSITORIES</text>
    <text x="115" y="339" class="mono">config/agents.json</text>
    <text x="115" y="372" class="copy">Single canonical source of truth</text>
    <text x="115" y="398" class="small">responsibilities · routing · clone capacity · health policy</text>

    <rect x="85" y="455" width="370" height="145" rx="19" fill="url(#source)" stroke="#32705d"/>
    <rect x="318" y="469" width="117" height="27" rx="9" class="extend"/><text x="335" y="487" class="extend-text">+ PROMPT PATHS</text>
    <text x="115" y="494" class="mono">prompts/</text>
    <text x="115" y="526" class="copy">common/</text><text x="205" y="526" class="small">evidence · protocol · approvals</text>
    <text x="115" y="554" class="copy">roles/</text><text x="188" y="554" class="small">orchestrator · keeper · analyst</text>
    <text x="188" y="578" class="small">developer · reviewer · pipeline · health</text>

    <rect x="85" y="630" width="370" height="195" rx="19" fill="url(#source)" stroke="#32705d"/>
    <rect x="324" y="644" width="111" height="27" rx="9" class="extend"/><text x="344" y="662" class="extend-text">+ SKILL.MD</text>
    <text x="115" y="669" class="mono">plugins/.../skills/</text>
    <text x="115" y="702" class="copy">13 workflow + engineering skills</text>
    <text x="115" y="728" class="small">analyze · keep knowledge · implement</text>
    <text x="115" y="752" class="small">review · coordinate · monitor · diagnose health</text>
    <text x="115" y="783" class="copy">DRY/KISS/SOLID + .NET/JS/React</text>
    <text x="115" y="809" class="small">azure-pr-review-monitor · azure-pipeline-monitor</text>

    <rect x="85" y="855" width="370" height="120" rx="19" fill="url(#source)" stroke="#32705d"/>
    <rect x="302" y="869" width="133" height="27" rx="9" class="extend"/><text x="319" y="887" class="extend-text">+ KNOWLEDGE ROOT</text>
    <text x="115" y="894" class="mono">knowledge/managed/</text>
    <text x="115" y="926" class="copy">Versioned verified knowledge</text>
    <text x="115" y="952" class="small">seed import · provenance · decisions</text>

    <rect x="85" y="1005" width="370" height="105" rx="19" fill="#122230" stroke="#30556c"/>
    <rect x="326" y="1019" width="109" height="27" rx="9" class="extend"/><text x="348" y="1037" class="extend-text">+ UI / DOCS</text>
    <text x="115" y="1044" class="mono">dashboard/ + docs/</text>
    <text x="115" y="1077" class="copy">Operator UI and maintained guidance</text>
  </g>

  <!-- runtime -->
  <g filter="url(#shadow)">
    <rect x="545" y="300" width="420" height="130" rx="20" fill="url(#runtime)" stroke="#355676"/>
    <rect x="824" y="314" width="121" height="27" rx="9" class="extend"/><text x="840" y="332" class="extend-text">+ VALIDATORS</text>
    <text x="575" y="340" class="mono">AgentEcosystem.psm1</text>
    <text x="575" y="373" class="copy">Load · expand paths · validate JSON</text>
    <text x="575" y="400" class="small">Reject plaintext secrets and missing files</text>

    <rect x="545" y="465" width="420" height="135" rx="20" fill="url(#runtime)" stroke="#355676"/>
    <rect x="805" y="479" width="140" height="27" rx="9" class="extend"/><text x="820" y="497" class="extend-text">+ COMPILE STEPS</text>
    <text x="575" y="505" class="mono">Sync-AgentDefinitions.ps1</text>
    <text x="575" y="538" class="copy">Compose prompts + enabled skills</text>
    <text x="575" y="566" class="small">7 standard + 7 OS-compatible TOML definitions</text>

    <rect x="545" y="635" width="420" height="155" rx="20" fill="url(#runtime)" stroke="#355676"/>
    <rect x="822" y="649" width="123" height="27" rx="9" class="extend"/><text x="838" y="667" class="extend-text">+ WORKFLOWS</text>
    <text x="575" y="675" class="mono">Start-DevelopmentWorkflow.ps1</text>
    <text x="575" y="708" class="copy">Orchestrator routing + capacity-limited task clone ownership</text>
    <text x="575" y="736" class="small">Switch-TaskWorkspace · FIFO admission · full clone manifests</text>
    <text x="575" y="762" class="small">event chain · push · PR → Orchestrator → final Keeper · Health retry</text>

    <rect x="545" y="825" width="420" height="150" rx="20" fill="url(#runtime)" stroke="#355676"/>
    <rect x="804" y="839" width="141" height="27" rx="9" class="extend"/><text x="819" y="857" class="extend-text">+ REVIEW INPUTS</text>
    <text x="575" y="865" class="mono">Review runtime</text>
    <text x="575" y="898" class="copy">Sync config · collect per-PR discussions</text>
    <text x="575" y="926" class="small">Per-PR hash · pending AI / human state</text>
    <text x="575" y="952" class="small">Changed-PR AI review + 2h model-free PR status</text>

    <rect x="545" y="1010" width="420" height="100" rx="20" fill="#15263a" stroke="#416783"/>
    <rect x="830" y="1024" width="115" height="27" rx="9" class="extend"/><text x="849" y="1042" class="extend-text">+ UI ROUTES</text>
    <text x="575" y="1049" class="mono">Start-AgentDashboard.ps1</text>
    <text x="575" y="1081" class="copy">Local/external review · close · reopen · live logs</text>
  </g>

  <!-- agents -->
  <g filter="url(#shadow)">
    <rect x="1055" y="300" width="175" height="145" rx="22" fill="url(#agent)" stroke="#4a6387"/>
    <rect x="1250" y="300" width="175" height="145" rx="22" fill="url(#agent)" stroke="#4a6387"/>
    <rect x="1288" y="286" width="117" height="27" rx="9" class="extend"/><text x="1307" y="304" class="extend-text">+ AGENT ROLE</text>
    <text x="1078" y="340" class="lane">CONTROL PLANE</text>
    <text x="1078" y="376" class="agent-title">Workflow</text>
    <text x="1078" y="400" class="agent-title">Orchestrator</text>
    <text x="1078" y="428" class="agent-copy">routing + task clone lease</text>
    <text x="1273" y="340" class="lane">KNOWLEDGE</text>
    <text x="1273" y="376" class="agent-title">Knowledge Keeper</text>
    <text x="1273" y="406" class="agent-copy">on-demand context + skills</text>
    <text x="1273" y="428" class="agent-copy">routed verified final summary</text>

    <rect x="1055" y="470" width="175" height="130" rx="20" fill="url(#agent)" stroke="#4a6387"/>
    <text x="1078" y="507" class="agent-title">Requirements</text>
    <text x="1078" y="532" class="agent-title">Analyst</text>
    <text x="1078" y="563" class="agent-copy">ready / held scope</text>
    <text x="1078" y="584" class="agent-copy">conflicts · questions</text>

    <rect x="1250" y="470" width="175" height="130" rx="20" fill="url(#agent)" stroke="#4a6387"/>
    <text x="1273" y="507" class="agent-title">Developer</text>
    <text x="1273" y="537" class="agent-copy">plan · branch · code</text>
    <text x="1273" y="560" class="agent-copy">tests · evidence</text>
    <text x="1273" y="584" class="agent-copy">approved scope + selected skills</text>

    <rect x="1055" y="625" width="175" height="130" rx="20" fill="url(#agent)" stroke="#4a6387"/>
    <text x="1078" y="662" class="agent-title">Reviewer</text>
    <text x="1078" y="692" class="agent-copy">code + agent work</text>
    <text x="1078" y="715" class="agent-copy">requirements + principles</text>
    <text x="1078" y="739" class="agent-copy">human decision gate</text>

    <rect x="1250" y="625" width="175" height="130" rx="20" fill="url(#agent)" stroke="#4a6387"/>
    <text x="1273" y="662" class="agent-title">Pipeline</text>
    <text x="1273" y="686" class="agent-title">Monitor</text>
    <text x="1273" y="715" class="agent-copy">push · SHA · PR → Orchestrator</text>
    <text x="1273" y="739" class="agent-copy">code/test/YAML · max 3</text>

    <rect x="1055" y="780" width="370" height="110" rx="20" fill="#173038" stroke="#4b8375"/>
    <text x="1085" y="818" class="agent-title">Health Check Agent</text>
    <text x="1085" y="846" class="agent-copy">failures + ecosystem source maintenance</text>
    <text x="1085" y="870" class="agent-copy">bounded repair + affected-agent retry</text>

    <rect x="1055" y="915" width="370" height="85" rx="20" fill="#182944" stroke="#536f9b"/>
    <text x="1085" y="950" class="mono">${CODEX_HOME}/agents/*.toml</text>
    <text x="1085" y="978" class="small">Seven standard; seven derived after policy denial</text>

    <rect x="1055" y="1025" width="370" height="85" rx="20" fill="#182d36" stroke="#3f7468"/>
    <rect x="1268" y="1009" width="137" height="27" rx="9" class="extend"/><text x="1283" y="1027" class="extend-text">+ ARTIFACT SCHEMA</text>
    <text x="1085" y="1058" class="mono">private checkpoints + validated outcomes</text>
    <text x="1085" y="1086" class="small">routing · workspace sessions · role outcomes · summary</text>
  </g>

  <!-- external -->
  <g filter="url(#shadow)">
    <rect x="1515" y="300" width="200" height="130" rx="20" fill="url(#external)" stroke="#665185"/>
    <text x="1540" y="340" class="box-title">Azure Boards</text>
    <text x="1540" y="373" class="copy">tasks · comments</text>
    <text x="1540" y="399" class="small">assigned to user</text>

    <rect x="1515" y="470" width="200" height="160" rx="20" fill="url(#external)" stroke="#665185"/>
    <text x="1540" y="510" class="box-title">Pull requests</text>
    <text x="1540" y="543" class="copy">revisions · threads</text>
    <text x="1540" y="570" class="small">ps-excel-agent</text>
    <text x="1540" y="594" class="small">ps-bicep</text>
    <text x="1540" y="618" class="small">ps-app-delfi</text>

    <rect x="1515" y="670" width="200" height="130" rx="20" fill="url(#external)" stroke="#665185"/>
    <text x="1540" y="710" class="box-title">Pipelines</text>
    <text x="1540" y="743" class="copy">runs · stages · logs</text>
    <text x="1540" y="769" class="small">exact branch and SHA</text>

    <rect x="1515" y="840" width="200" height="145" rx="20" fill="#25203a" stroke="#665185"/>
    <text x="1540" y="880" class="box-title">Local state</text>
    <text x="1540" y="913" class="copy">%LOCALAPPDATA%</text>
    <text x="1540" y="940" class="small">task histories · workspace sessions</text>
    <text x="1540" y="964" class="small">lease queue · reports · PR index · revisions</text>

    <rect x="1515" y="1025" width="200" height="85" rx="20" fill="#1a2a2d" stroke="#47716b"/>
    <rect x="1622" y="1037" width="76" height="25" rx="8" class="extend"/><text x="1636" y="1054" class="extend-text">+ AUTH</text>
    <text x="1540" y="1063" class="box-title">Azure CLI</text>
    <text x="1540" y="1089" class="small">credential store</text>
  </g>

  <!-- composition flow -->
  <path class="edge" d="M455 362H545"/><path class="edge" d="M455 525C500 525 505 532 545 532"/><path class="edge" d="M455 715C500 715 505 565 545 555"/>
  <path class="edge" d="M755 430V465"/><path class="edge" d="M965 532C1010 532 1015 955 1055 955"/><path class="edge" d="M1055 955C1000 955 1000 700 965 700"/>
  <path class="edge" d="M965 710C1005 710 1015 372 1055 372"/>
  <path class="edge-bi" d="M1142 445V470"/><path class="edge-bi" d="M1337 445V470"/><path class="edge-bi" d="M1142 600V625"/><path class="edge-bi" d="M1337 600V625"/>
  <path class="edge-bi" d="M1240 445V780"/><path class="edge" d="M1240 890V1025"/><path class="edge" d="M455 915C760 915 800 1068 1055 1068"/><path class="edge" d="M965 1060H1055"/>

  <!-- external flow -->
  <path class="edge-violet" d="M1515 365H1425C1470 365 1470 535 1425 535"/><path class="edge-violet" d="M1515 550H1425C1465 550 1460 690 1230 690"/>
  <path class="edge-violet" d="M1515 735H1425"/><path class="edge-blue" d="M1425 1068H1515"/><path class="edge-blue" d="M1425 955H1515"/>
  <path class="edge-dashed" d="M1515 1068C1465 1068 1465 545 1425 545"/>

  <text x="472" y="345" class="label">validate</text><text x="468" y="507" class="label">compose</text><text x="978" y="514" class="label">install</text>
  <text x="978" y="688" class="label">route + lease</text><text x="1260" y="1012" class="label">append results</text><text x="1435" y="532" class="label">review evidence</text>
  <text x="1438" y="718" class="label">exact SHA + bounded logs</text><text x="1438" y="1038" class="label">authenticated reads</text>
</svg>
