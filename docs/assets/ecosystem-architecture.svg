<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2050" viewBox="0 0 3200 2050" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">Development Agent Ecosystem architecture</title>
  <desc id="desc">Large-scale architecture showing isolated task clones, the host-driven agent chain, separate Reviewer and Review Verifier invocations, the review coverage matrix, finding lifecycle history, exact review hash binding, human decisions, and verified pipeline delivery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="0.55" stop-color="#0c1420"/>
      <stop offset="1" stop-color="#111a2d"/>
    </linearGradient>
    <linearGradient id="control" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#61e8ba"/>
      <stop offset="1" stop-color="#2aba87"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2b40"/>
      <stop offset="1" stop-color="#111d2d"/>
    </linearGradient>
    <linearGradient id="artifact" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#222744"/>
      <stop offset="1" stop-color="#171b32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000711" flood-opacity="0.48"/>
    </filter>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#62e7b8"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#84a9ff"/>
    </marker>
    <marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b69cff"/>
    </marker>
    <style>
      .title{font:700 66px 'Segoe UI',Arial,sans-serif;fill:#f5f8fc;letter-spacing:-1.8px}
      .subtitle{font:400 27px 'Segoe UI',Arial,sans-serif;fill:#a5b5c8}
      .eyebrow{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#69e8bc;letter-spacing:3px}
      .control-eyebrow{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#0b4936;letter-spacing:3px}
      .control-title{font:750 42px 'Segoe UI',Arial,sans-serif;fill:#061710}
      .control-copy{font:500 22px 'Segoe UI',Arial,sans-serif;fill:#0b3e2e}
      .card-title{font:700 29px 'Segoe UI',Arial,sans-serif;fill:#f3f7fc}
      .copy{font:400 19px 'Segoe UI',Arial,sans-serif;fill:#b3c2d2}
      .small{font:500 16px 'Segoe UI',Arial,sans-serif;fill:#91a5bc}
      .label{font:650 16px 'Segoe UI',Arial,sans-serif;fill:#d0dbe7}
      .edge{fill:none;stroke:#62e7b8;stroke-width:3.5;marker-end:url(#green)}
      .edge-bi{fill:none;stroke:#62e7b8;stroke-width:3.5;marker-start:url(#green);marker-end:url(#green)}
      .edge-blue{fill:none;stroke:#84a9ff;stroke-width:3.2;marker-end:url(#blue)}
      .edge-violet{fill:none;stroke:#b69cff;stroke-width:3.2;marker-end:url(#violet)}
      .edge-dashed{fill:none;stroke:#84a9ff;stroke-width:3;stroke-dasharray:12 10;marker-end:url(#blue)}
      .label-bg{fill:#101b2a;stroke:#30465d;stroke-width:1}
    </style>
  </defs>

  <rect width="3200" height="2050" fill="url(#background)"/>
  <circle cx="260" cy="130" r="430" fill="#35dda7" opacity="0.055"/>
  <circle cx="2920" cy="120" r="510" fill="#7894ff" opacity="0.06"/>
  <path d="M0 1560C620 1360 1020 1690 1630 1490C2200 1305 2680 1460 3200 1240V2050H0Z" fill="#111d2d" opacity="0.62"/>

  <text x="100" y="100" class="eyebrow">EVIDENCE-FIRST · TASK-ISOLATED · INDEPENDENTLY VERIFIED</text>
  <text x="100" y="180" class="title">Development Agent Ecosystem</text>
  <text x="100" y="232" class="subtitle">Eight autonomous roles, one controller chain per task, full repository clones, explicit review coverage, lifecycle history, and exact-SHA delivery gates.</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <g data-card="task-inputs">
      <rect x="90" y="340" width="450" height="220" rx="26" fill="url(#artifact)" stroke="#465172" stroke-width="2"/>
      <text x="135" y="395" class="eyebrow">TASK INPUTS</text>
      <text x="135" y="442" class="card-title">Azure Boards + user</text>
      <text x="135" y="485" class="copy">Requirements · comments · decisions</text>
      <text x="135" y="518" class="copy">Manual or automated discovery</text>
      <text x="135" y="547" class="small">Explicit targets stay isolated to one task</text>
    </g>
    <g data-card="code-evidence">
      <rect x="90" y="630" width="450" height="220" rx="26" fill="url(#artifact)" stroke="#465172" stroke-width="2"/>
      <text x="135" y="685" class="eyebrow">REVISION EVIDENCE</text>
      <text x="135" y="732" class="card-title">Source + tests</text>
      <text x="135" y="775" class="copy">Exact task branch and commit</text>
      <text x="135" y="808" class="copy">Requirements · accepted knowledge</text>
      <text x="135" y="837" class="small">No shared checkout between tasks</text>
    </g>
    <g data-card="pr-inputs">
      <rect x="90" y="920" width="450" height="220" rx="26" fill="url(#artifact)" stroke="#465172" stroke-width="2"/>
      <text x="135" y="975" class="eyebrow">REVIEW INPUTS</text>
      <text x="135" y="1022" class="card-title">PR discussion</text>
      <text x="135" y="1065" class="copy">Diffs · threads · local notes</text>
      <text x="135" y="1098" class="copy">Per-PR fingerprints and status</text>
      <text x="135" y="1127" class="small">Untrusted evidence, never instructions</text>
    </g>
  </g>

  <!-- Control plane -->
  <g filter="url(#shadow)" data-card="orchestrator">
    <rect x="650" y="320" width="2450" height="270" rx="34" fill="url(#control)"/>
    <text x="710" y="380" class="control-eyebrow">CONTROL PLANE</text>
    <text x="710" y="438" class="control-title">Workflow Orchestrator</text>
    <text x="710" y="485" class="control-copy">Classifies task intent, selects the narrowest execution mode, and dispatches one isolated role at a time</text>
    <text x="710" y="522" class="control-copy">Persists durable routes, exact run/lease ownership, stop/resume gates, and missing-continuation recovery</text>
    <text x="710" y="559" class="control-copy">Never performs requirements, implementation, review, verification, pipeline, knowledge, or health work</text>
  </g>

  <!-- Main role chain -->
  <g filter="url(#shadow)">
    <g data-card="requirements">
      <rect x="620" y="720" width="455" height="270" rx="27" fill="url(#agent)" stroke="#334a62" stroke-width="2"/>
      <text x="665" y="775" class="eyebrow">ANALYZE</text>
      <text x="665" y="822" class="card-title">Requirements Analyst</text>
      <text x="665" y="865" class="copy">Ready scope · held scope</text>
      <text x="665" y="898" class="copy">Acceptance · sources · questions</text>
      <text x="665" y="931" class="copy">Human-readable workflow and plan</text>
      <text x="665" y="963" class="small">Read-only analysis</text>
    </g>
    <g data-card="developer">
      <rect x="1120" y="720" width="455" height="270" rx="27" fill="url(#agent)" stroke="#334a62" stroke-width="2"/>
      <text x="1165" y="775" class="eyebrow">IMPLEMENT</text>
      <text x="1165" y="822" class="card-title">Developer</text>
      <text x="1165" y="865" class="copy">Approved ready scope only</text>
      <text x="1165" y="898" class="copy">Task branch · code · tests</text>
      <text x="1165" y="931" class="copy">Final command and Git evidence</text>
      <text x="1165" y="963" class="small">Never applies an unverified proposal</text>
    </g>
    <g data-card="reviewer">
      <rect x="1620" y="720" width="455" height="270" rx="27" fill="url(#agent)" stroke="#334a62" stroke-width="2"/>
      <text x="1665" y="775" class="eyebrow">CANDIDATE REVIEW</text>
      <text x="1665" y="822" class="card-title">Reviewer</text>
      <text x="1665" y="865" class="copy">Requirements · code · tests</text>
      <text x="1665" y="898" class="copy">10-dimension reviewCoverage</text>
      <text x="1665" y="931" class="copy">new · unchanged · resolved · regressed</text>
      <text x="1665" y="963" class="small">Read-only; candidates are not authority</text>
    </g>
    <g data-card="review-verifier">
      <rect x="2120" y="720" width="455" height="270" rx="27" fill="#1a2941" stroke="#647fbc" stroke-width="2.5"/>
      <text x="2165" y="775" class="eyebrow" style="fill:#9db7ff">INDEPENDENT FALSIFICATION</text>
      <text x="2165" y="822" class="card-title">Review Verifier</text>
      <text x="2165" y="865" class="copy">Separate read-only invocation</text>
      <text x="2165" y="898" class="copy">Exact review SHA-256 binding</text>
      <text x="2165" y="931" class="copy">confirmed · rejected · needs-human</text>
      <text x="2165" y="963" class="small">No Reviewer private checkpoints</text>
    </g>
    <g data-card="pipeline">
      <rect x="2620" y="720" width="455" height="270" rx="27" fill="url(#agent)" stroke="#334a62" stroke-width="2"/>
      <text x="2665" y="775" class="eyebrow">VERIFIED DELIVERY</text>
      <text x="2665" y="822" class="card-title">Pipeline Monitor</text>
      <text x="2665" y="865" class="copy">Guarded task-branch push</text>
      <text x="2665" y="898" class="copy">Exact commit · allowlisted builds</text>
      <text x="2665" y="931" class="copy">Bounded code/test remediation</text>
      <text x="2665" y="963" class="small">Completed PR returns to Orchestrator</text>
    </g>
  </g>

  <!-- Evidence, gates, and operator state -->
  <g filter="url(#shadow)">
    <g data-card="knowledge">
      <rect x="620" y="1120" width="500" height="260" rx="27" fill="#15293b" stroke="#41687e" stroke-width="2"/>
      <text x="665" y="1175" class="eyebrow">KNOWLEDGE SERVICE</text>
      <text x="665" y="1222" class="card-title">Knowledge Keeper</text>
      <text x="665" y="1265" class="copy">Minimal public context and skills</text>
      <text x="665" y="1298" class="copy">Successful outcomes only</text>
      <text x="665" y="1331" class="copy">Verified standards + final summary</text>
      <text x="665" y="1362" class="small">Never reads private failed checkpoints</text>
    </g>
    <g data-card="review-history">
      <rect x="1220" y="1120" width="660" height="260" rx="27" fill="url(#artifact)" stroke="#5e6091" stroke-width="2"/>
      <text x="1265" y="1175" class="eyebrow" style="fill:#b4a6ff">IMMUTABLE REVIEW EVIDENCE</text>
      <text x="1265" y="1222" class="card-title">Coverage matrix + finding lifecycle</text>
      <text x="1265" y="1265" class="copy">review-result.json → hash-addressed snapshot</text>
      <text x="1265" y="1298" class="copy">review-history-index.json → prior revision chain</text>
      <text x="1265" y="1331" class="copy">review-verification.json → exact SHA verdicts</text>
      <text x="1265" y="1362" class="small">Stale verification cannot authorize rework or delivery</text>
    </g>
    <g data-card="human-gate">
      <path d="M2205 1090L2460 1250L2205 1410L1950 1250Z" fill="#2a213e" stroke="#8c78c3" stroke-width="2.7"/>
      <text x="2205" y="1208" text-anchor="middle" class="card-title">Human decision gate</text>
      <text x="2205" y="1248" text-anchor="middle" class="copy">confirmed / needs-human only</text>
      <text x="2205" y="1283" text-anchor="middle" class="small">approve · reject · defer</text>
      <text x="2205" y="1310" text-anchor="middle" class="small">tracked exact-review bypass</text>
    </g>
    <g data-card="dashboard">
      <rect x="2600" y="1120" width="500" height="260" rx="27" fill="#15293b" stroke="#41687e" stroke-width="2"/>
      <text x="2645" y="1175" class="eyebrow">OPERATOR DASHBOARD</text>
      <text x="2645" y="1222" class="card-title">Switch and inspect tasks</text>
      <text x="2645" y="1265" class="copy">Coverage + verifier verdicts</text>
      <text x="2645" y="1298" class="copy">Finding lifecycle + local diff</text>
      <text x="2645" y="1331" class="copy">Capacity · queue · clone · heartbeat</text>
      <text x="2645" y="1362" class="small">Live logs · stop · resume · reopen</text>
    </g>

    <g data-card="capacity">
      <rect x="90" y="1450" width="450" height="235" rx="26" fill="#153039" stroke="#4a8175" stroke-width="2"/>
      <text x="135" y="1505" class="eyebrow">TASK ISOLATION</text>
      <text x="135" y="1552" class="card-title">Clone + lease coordinator</text>
      <text x="135" y="1595" class="copy">Full clone per task/repository</text>
      <text x="135" y="1628" class="copy">One exact controller lease per task</text>
      <text x="135" y="1659" class="small">2 active by default · durable FIFO</text>
    </g>
    <g data-card="health">
      <rect x="620" y="1510" width="500" height="235" rx="26" fill="#173039" stroke="#4a8175" stroke-width="2"/>
      <text x="665" y="1565" class="eyebrow">DIAGNOSE · SAFE REPAIR</text>
      <text x="665" y="1612" class="card-title">Health Check Agent</text>
      <text x="665" y="1655" class="copy">Bounded ecosystem-only repair</text>
      <text x="665" y="1688" class="copy">Full validation · affected-role retry</text>
      <text x="665" y="1719" class="small">Product repositories remain excluded</text>
    </g>
    <g data-card="guard">
      <rect x="1220" y="1510" width="660" height="235" rx="26" fill="#17263a" stroke="#4d6687" stroke-width="2"/>
      <text x="1265" y="1565" class="eyebrow">TRUSTED HOST</text>
      <text x="1265" y="1612" class="card-title">Execution guard + continuation recovery</text>
      <text x="1265" y="1655" class="copy">Stops three identical failures · preserves artifacts</text>
      <text x="1265" y="1688" class="copy">Restarts only a missing eligible transition</text>
      <text x="1265" y="1719" class="small">Per-task locks prevent cross-task status changes</text>
    </g>
    <g data-card="debt">
      <rect x="1990" y="1510" width="470" height="235" rx="26" fill="#29213c" stroke="#7868a6" stroke-width="2"/>
      <text x="2035" y="1565" class="eyebrow" style="fill:#bba8ff">AUDITABLE EXCEPTION</text>
      <text x="2035" y="1612" class="card-title">Task-local technical debt</text>
      <text x="2035" y="1655" class="copy">TD-REV-NNN stays unresolved</text>
      <text x="2035" y="1688" class="copy">Bound to review revision + SHA</text>
      <text x="2035" y="1719" class="small">Open linked debt required for bypass</text>
    </g>
    <g data-card="azure-pipelines">
      <rect x="2600" y="1510" width="500" height="235" rx="26" fill="#23223c" stroke="#625b8b" stroke-width="2"/>
      <text x="2645" y="1565" class="eyebrow" style="fill:#a9b9ff">EXTERNAL DELIVERY STATE</text>
      <text x="2645" y="1612" class="card-title">Azure Pipelines + task PR</text>
      <text x="2645" y="1655" class="copy">Exact-SHA runs · bounded logs</text>
      <text x="2645" y="1688" class="copy">Active · completed · abandoned PR</text>
      <text x="2645" y="1719" class="small">No inferred deployments or queue IDs</text>
    </g>
  </g>

  <!-- Input and control edges -->
  <path class="edge-blue" d="M540 450H650"/>
  <path class="edge-blue" d="M540 740H620"/>
  <path class="edge-blue" d="M540 1030C590 1030 595 860 620 860"/>
  <path class="edge" d="M875 590V720"/>
  <path class="edge" d="M1375 590V720"/>
  <path class="edge" d="M1875 590V720"/>
  <path class="edge" d="M2375 590V720"/>
  <path class="edge" d="M2875 590V720"/>

  <!-- Main delivery chain -->
  <path class="edge" d="M1075 855H1120"/>
  <path class="edge" d="M1575 855H1620"/>
  <path class="edge" d="M2075 855H2120"/>
  <path class="edge" d="M2575 855H2620"/>

  <!-- Review evidence and decision flows -->
  <path class="edge-violet" d="M1845 990V1080H1550V1120"/>
  <path class="edge-violet" d="M1880 1250H1950"/>
  <path class="edge-blue" d="M2348 990V1060H2205V1090"/>
  <path class="edge-blue" d="M2120 785C2040 660 1935 660 1845 720"/>
  <path class="edge" d="M2460 1250H2520V855H2620"/>
  <path class="edge-violet" d="M2205 1410V1510"/>
  <path class="edge" d="M2460 1628H2600"/>
  <path class="edge-dashed" d="M2120 1320C1780 1460 1430 1460 1345 990"/>

  <!-- Service, isolation, health, dashboard, and delivery -->
  <path class="edge-bi" d="M1120 1250H1220"/>
  <path class="edge-bi" d="M2600 1250H2500V520H2460"/>
  <path class="edge-blue" d="M650 520C430 690 350 1160 315 1450"/>
  <path class="edge-blue" d="M1220 1628H1120"/>
  <path class="edge" d="M3075 855H3130V1628H3100"/>
  <path class="edge-dashed" d="M2620 930C2450 1040 1650 1070 1350 720"/>

  <!-- Labels in clear gaps -->
  <g>
    <rect x="548" y="405" width="94" height="34" rx="11" class="label-bg"/>
    <text x="595" y="428" text-anchor="middle" class="label">route</text>
    <rect x="1080" y="810" width="115" height="34" rx="11" class="label-bg"/>
    <text x="1138" y="833" text-anchor="middle" class="label">ready scope</text>
    <rect x="1578" y="810" width="98" height="34" rx="11" class="label-bg"/>
    <text x="1627" y="833" text-anchor="middle" class="label">evidence</text>
    <rect x="2078" y="810" width="96" height="34" rx="11" class="label-bg"/>
    <text x="2126" y="833" text-anchor="middle" class="label">snapshot</text>
    <rect x="2578" y="810" width="92" height="34" rx="11" class="label-bg"/>
    <text x="2624" y="833" text-anchor="middle" class="label">passed</text>
    <rect x="2215" y="1463" width="175" height="34" rx="11" class="label-bg"/>
    <text x="2302" y="1486" text-anchor="middle" class="label">tracked bypass only</text>
  </g>

  <!-- Footer legend -->
  <line x1="2140" y1="1905" x2="2230" y2="1905" class="edge"/>
  <text x="2250" y="1912" class="small">validated automatic handoff</text>
  <line x1="2140" y1="1960" x2="2230" y2="1960" class="edge-violet"/>
  <text x="2250" y="1967" class="small">review evidence, decision, or audit binding</text>
  <line x1="2680" y1="1905" x2="2770" y2="1905" class="edge-dashed"/>
  <text x="2790" y="1912" class="small">bounded rework or remediation loop</text>
</svg>
