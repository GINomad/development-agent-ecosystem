<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Development Agent Ecosystem architecture</title>
  <desc id="desc">Knowledge Keeper orchestrates Requirements Analyst, Developer, Reviewer, and Pipeline Monitor. Azure Boards, code, pull request discussions, a decision gate, and versioned knowledge surround the agent workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="0.55" stop-color="#0c1420"/>
      <stop offset="1" stop-color="#10182a"/>
    </linearGradient>
    <linearGradient id="keeper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56e5b2"/>
      <stop offset="1" stop-color="#25b985"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18283a"/>
      <stop offset="1" stop-color="#111d2b"/>
    </linearGradient>
    <linearGradient id="external" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23213d"/>
      <stop offset="1" stop-color="#17182c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#62e7b8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#82aaff"/>
    </marker>
    <style>
      .title{font:700 50px 'Segoe UI',Arial,sans-serif;fill:#f4f8fc;letter-spacing:-1.5px}
      .subtitle{font:400 21px 'Segoe UI',Arial,sans-serif;fill:#9badc2}
      .eyebrow{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#63e5b7;letter-spacing:3px}
      .box-title{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#f4f8fc}
      .box-copy{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#aebccd}
      .keeper-title{font:750 29px 'Segoe UI',Arial,sans-serif;fill:#061510}
      .keeper-copy{font:500 17px 'Segoe UI',Arial,sans-serif;fill:#0d3b2d}
      .label{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#bfccda}
      .tiny{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#8093a9}
      .edge{fill:none;stroke:#62e7b8;stroke-width:3;marker-end:url(#arrowGreen)}
      .edge-bi{fill:none;stroke:#62e7b8;stroke-width:3;marker-start:url(#arrowGreen);marker-end:url(#arrowGreen)}
      .edge-blue{fill:none;stroke:#82aaff;stroke-width:2.5;marker-end:url(#arrowBlue)}
      .edge-dashed{fill:none;stroke:#82aaff;stroke-width:2.5;stroke-dasharray:10 9;marker-end:url(#arrowBlue)}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <circle cx="210" cy="115" r="260" fill="#2ed69b" opacity="0.055"/>
  <circle cx="1440" cy="160" r="330" fill="#718dff" opacity="0.06"/>
  <path d="M0 790 C320 690 510 910 820 810 C1110 715 1260 760 1600 650 L1600 1000 L0 1000Z" fill="#101b2a" opacity="0.65"/>

  <text x="100" y="92" class="eyebrow">EVIDENCE-FIRST SOFTWARE DELIVERY</text>
  <text x="100" y="150" class="title">Development Agent Ecosystem</text>
  <text x="100" y="190" class="subtitle">Verified context flows through one orchestrator. Unclear scope stops; approved scope moves forward.</text>

  <!-- External inputs -->
  <g filter="url(#shadow)">
    <rect x="80" y="285" width="285" height="130" rx="20" fill="url(#external)" stroke="#384164"/>
    <circle cx="120" cy="326" r="18" fill="#82aaff" opacity="0.18"/>
    <path d="M112 326h16M120 318v16" stroke="#9ab5ff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="150" y="330" class="box-title">Azure Boards</text>
    <text x="110" y="368" class="box-copy">Tasks · requirements · comments</text>
    <text x="110" y="394" class="tiny">Assigned work items in manual or automate mode</text>

    <rect x="80" y="470" width="285" height="130" rx="20" fill="url(#external)" stroke="#384164"/>
    <circle cx="120" cy="511" r="18" fill="#82aaff" opacity="0.18"/>
    <path d="M111 507h18M111 515h13" stroke="#9ab5ff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="150" y="515" class="box-title">Codebase</text>
    <text x="110" y="553" class="box-copy">Source · tests · local history</text>
    <text x="110" y="579" class="tiny">Repository evidence at an exact revision</text>

    <rect x="80" y="655" width="285" height="145" rx="20" fill="url(#external)" stroke="#384164"/>
    <circle cx="120" cy="696" r="18" fill="#82aaff" opacity="0.18"/>
    <path d="M111 691h18v12h-10l-5 5v-5h-3z" fill="none" stroke="#9ab5ff" stroke-width="2" stroke-linejoin="round"/>
    <text x="150" y="700" class="box-title">PR discussion</text>
    <text x="110" y="738" class="box-copy">Code changes · review threads</text>
    <text x="110" y="764" class="box-copy">User comments · local notes</text>
  </g>

  <!-- Orchestrator -->
  <g filter="url(#shadow)">
    <rect x="565" y="280" width="470" height="165" rx="28" fill="url(#keeper)"/>
    <text x="610" y="333" class="eyebrow" style="fill:#0e4937">PRIMARY ORCHESTRATOR</text>
    <text x="610" y="375" class="keeper-title">Knowledge Keeper</text>
    <text x="610" y="409" class="keeper-copy">Selects verified context · records task history</text>
    <text x="610" y="433" class="keeper-copy">Publishes evidence-backed knowledge only</text>
  </g>

  <!-- Agents -->
  <g filter="url(#shadow)">
    <rect x="440" y="525" width="315" height="145" rx="22" fill="url(#agent)" stroke="#314459"/>
    <text x="475" y="571" class="eyebrow">ANALYZE</text>
    <text x="475" y="606" class="box-title">Requirements Analyst</text>
    <text x="475" y="638" class="box-copy">Ready scope · held scope · questions</text>

    <rect x="845" y="525" width="315" height="145" rx="22" fill="url(#agent)" stroke="#314459"/>
    <text x="880" y="571" class="eyebrow">IMPLEMENT</text>
    <text x="880" y="606" class="box-title">Developer</text>
    <text x="880" y="638" class="box-copy">Branch · code · tests · evidence</text>

    <rect x="440" y="750" width="315" height="145" rx="22" fill="url(#agent)" stroke="#314459"/>
    <text x="475" y="796" class="eyebrow">VERIFY</text>
    <text x="475" y="831" class="box-title">Reviewer</text>
    <text x="475" y="863" class="box-copy">Code + agent work · no automatic fix</text>

    <rect x="845" y="750" width="315" height="145" rx="22" fill="url(#agent)" stroke="#314459"/>
    <text x="880" y="796" class="eyebrow">VALIDATE DELIVERY</text>
    <text x="880" y="831" class="box-title">Pipeline Monitor</text>
    <text x="880" y="863" class="box-copy">Exact commit · status · failed logs</text>
  </g>

  <!-- Right-side gates and storage -->
  <g filter="url(#shadow)">
    <rect x="1240" y="300" width="280" height="145" rx="22" fill="#152638" stroke="#3e6178"/>
    <text x="1275" y="346" class="eyebrow">LONG-TERM MEMORY</text>
    <text x="1275" y="382" class="box-title">Versioned knowledge</text>
    <text x="1275" y="414" class="box-copy">Verified facts · decisions · provenance</text>

    <path d="M1380 545 l100 85 -100 85 -100 -85z" fill="#27213a" stroke="#7767a8" stroke-width="2"/>
    <text x="1380" y="613" text-anchor="middle" class="box-title" style="font-size:21px">Human review</text>
    <text x="1380" y="641" text-anchor="middle" class="box-copy">decision gate</text>
    <text x="1380" y="670" text-anchor="middle" class="tiny">approve · reject · defer</text>
  </g>

  <!-- Flows -->
  <path class="edge-blue" d="M365 350 C440 350 445 550 440 575"/>
  <path class="edge-blue" d="M365 535 H440"/>
  <path class="edge-blue" d="M365 725 C400 725 405 820 440 820"/>

  <path class="edge-bi" d="M680 445 C650 475 620 492 605 525"/>
  <path class="edge" d="M920 445 C955 475 985 492 995 525"/>
  <path class="edge" d="M755 595 H845"/>
  <path class="edge-bi" d="M635 670 C650 708 655 720 640 750"/>
  <path class="edge-bi" d="M965 670 C950 708 945 720 960 750"/>
  <path class="edge-dashed" d="M755 820 C930 710 1110 650 1280 630"/>
  <path class="edge" d="M1380 715 C1330 815 1230 840 1160 830"/>
  <path class="edge-bi" d="M1035 360 H1240"/>

  <text x="397" y="326" class="label">requirements</text>
  <text x="770" y="578" class="label">ready scope</text>
  <text x="735" y="705" class="label">evidence</text>
  <text x="1070" y="703" class="label">reviewed delivery</text>
  <text x="1135" y="337" class="label">verified updates</text>
  <text x="1090" y="620" class="label">findings</text>

  <!-- Footer legend -->
  <line x1="1215" y1="906" x2="1275" y2="906" class="edge"/>
  <text x="1290" y="912" class="tiny">agent handoff / verified flow</text>
  <line x1="1215" y1="946" x2="1275" y2="946" class="edge-dashed"/>
  <text x="1290" y="952" class="tiny">human approval required</text>
</svg>
